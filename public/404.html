<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Anders Hyatt Music</title>
    <script>
      (function () {
        var pages = {
          '/': true,
          '/live-music': true,
          '/duo-angella': true,
          '/duo-ben': true,
          '/trio': true,
          '/song-list': true,
          '/dj': true,
          '/photo-booth': true,
          '/connect': true,
        }
        var aliases = {
          '/songlist': '/song-list',
          '/playlist': '/song-list',
          '/faq': '/live-music#faq',
          '/dj-faq': '/dj#faq',
          '/events': '/live-music#events',
        }
        var path = location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '') || '/'
        if (path === '/planner' || path.indexOf('/planner/') === 0) return
        if (path === '/pipeline' || path.indexOf('/pipeline/') === 0) return
        var target = aliases[path] || (pages[path] ? path : '/')
        var meta = document.createElement('meta')
        meta.httpEquiv = 'refresh'
        meta.content = '0; url=' + target
        document.head.appendChild(meta)
        location.replace(target)
      })()
    </script>
  </head>
  <body>
    <p><a href="/">Anders Hyatt Music</a></p>
  </body>
</html>
